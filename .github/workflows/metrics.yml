name: Isometric Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # Only the isocalendar plugin is enabled — keeps the run fast
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Match the gold/dark theme used elsewhere in the README
          config_theme: dark
